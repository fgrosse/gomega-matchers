name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Install dependencies
        run: go get -t

      - name: Install ginkgo binary
        run: go install github.com/onsi/ginkgo/v2/ginkgo

      - name: Unit Tests
        run: ginkgo ./...
